site_name: OpenWrt provider
site_description: Terraform/OpenTofu provider for OpenWrt over ubus JSON-RPC
site_url: https://reznakt.github.io/terraform-provider-openwrt/
repo_url: https://github.com/reznakt/terraform-provider-openwrt
edit_uri: ""

# docs/ is generated by scripts/gen-docs.sh; this only renders it.
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

