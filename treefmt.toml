# `nix fmt` / `just fmt`. docs/ is generated by tfplugindocs.
excludes = ["docs/*", "go.sum", "flake.lock"]

[formatter.go]
command = "gofmt"
options = ["-w"]
includes = ["*.go"]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.shell]
command = "shfmt"
options = ["-w"]
includes = ["*.sh"]

[formatter.hcl]
command = "tofu"
options = ["fmt"]
includes = ["*.tf"]
